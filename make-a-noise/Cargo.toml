[package]
name = "make-a-noise"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "noise"
path = "src/main.rs"

[dependencies]
ort = "2.0.0-rc.13"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.20"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "native-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
